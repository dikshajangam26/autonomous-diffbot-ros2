# Same as slam_toolbox.yaml, with ONE change: transform_publish_period is 0.0.
# slam_toolbox then still builds /map and publishes the robot pose on /pose, but it does not
# broadcast map -> odom. The object_slam node (launch argument object_slam:=true) does that instead,
# using this LiDAR pose AND the recognised objects. Two nodes must never broadcast the same transform.
# slam_toolbox: builds a 2D map from the LiDAR and works out where the robot is IN that map.
#
# It listens to /scan and to the odometry transform odom -> base_link (made by our EKF), and it
# publishes the map and the transform  map -> odom.  That transform is the SLAM correction: when
# the wheels drift, map -> odom changes so that  map -> odom -> base_link  stays right.
#
# (All numbers below are slam_toolbox's well-tested defaults for a small robot; only the frames,
#  the scan topic and the laser range are specific to our robot.)
slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS params
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.0     # 0 = slam_toolbox does NOT publish map->odom; object_slam does
    map_update_interval: 2.0          # seconds between new /map pictures
    resolution: 0.05                  # meters per map cell
    min_laser_range: 0.12
    max_laser_range: 10.0             # our LiDAR sees up to 10 m
    minimum_time_interval: 0.3
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # General params
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.15     # add a new scan every 15 cm of travel ...
    minimum_travel_heading: 0.15      # ... or every 0.15 rad of turning
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation params - scan matching
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation params - loop closure
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan matcher params
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
