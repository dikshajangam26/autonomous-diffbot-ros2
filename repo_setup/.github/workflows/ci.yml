# Runs automatically on every push: checks the package still builds on ROS 2 Humble.
name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-serial
      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select task_robotics
