# Runs automatically on every push: checks the package still builds on ROS 2 Humble.
name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-pip python3-colcon-common-extensions python3-serial
          # ROS 2 Humble needs an older setuptools; newer ones break "colcon build" for Python packages
          pip3 install "setuptools==58.2.0"
          pip3 list 2>/dev/null | grep -i -E "setuptools|colcon-core" || true

      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --packages-select task_robotics

      - name: Smoke test (can ROS find our programs?)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          ros2 pkg executables task_robotics