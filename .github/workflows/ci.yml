# Runs automatically on every push: checks both packages build on ROS 2 Humble and the maths tests pass.
name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-serial python3-pytest
      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select task_robotics odom_computation
      - name: Odometry maths tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 -m pytest src/odom_computation/test -q
